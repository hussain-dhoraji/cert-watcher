{{- if and .Values.webhook.url (not .Values.webhook.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cert-watcher.webhookSecretName" . }}
  labels:
    {{- include "cert-watcher.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.webhook.url | quote }}
{{- end }}
