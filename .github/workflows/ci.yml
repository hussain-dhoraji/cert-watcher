name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build and run tests
        run: gradle build --no-daemon
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: build/reports/

  helm:
    name: Lint Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint helm/cert-watcher
      - name: Render with sample values
        run: |
          helm template demo helm/cert-watcher \
            --set 'config.endpoints[0]=example.com:443' \
            --set 'certificateSecrets[0]=demo-tls' \
            --set webhook.url=https://hooks.example.com/demo

  ansible:
    name: Lint Ansible role
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ansible-lint
        run: pip install ansible-core ansible-lint
      - name: Lint playbook and role
        run: ansible-lint playbook.yml roles/cert_watcher

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws-eks
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Check formatting
        run: terraform fmt -check -recursive -diff
      - name: Init without a backend
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  image:
    name: Build, scan and publish image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cert-watcher:ci .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cert-watcher:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Publish to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cert-watcher"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in latest "sha-${GITHUB_SHA::7}"; do
            docker tag cert-watcher:ci "$image:$tag"
            docker push "$image:$tag"
          done

  e2e:
    name: Deploy to kind and verify
    needs: [build, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
      - name: Build and load image into kind
        run: |
          docker build -t cert-watcher:e2e .
          kind load docker-image cert-watcher:e2e --name chart-testing
      - name: Create a TLS Secret that expires in 20 days
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 20 -subj "/CN=demo.local" -keyout tls.key -out tls.crt
          kubectl create secret tls demo-tls --cert tls.crt --key tls.key
      - name: Install chart
        run: |
          helm install cw helm/cert-watcher \
            --set image.repository=cert-watcher \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --set 'certificateSecrets[0]=demo-tls' \
            --set config.checkInterval=PT10S \
            --wait --timeout 5m
      - name: Expect the demo certificate to be reported as WARNING
        run: |
          kubectl port-forward svc/cw-cert-watcher 8080:8080 >/tmp/port-forward.log 2>&1 &
          for attempt in $(seq 1 30); do
            body=$(curl -sf http://localhost:8080/api/v1/certificates || true)
            echo "attempt $attempt: $body"
            if echo "$body" | grep -q '"severity":"WARNING"'; then
              exit 0
            fi
            sleep 5
          done
          kubectl logs deploy/cw-cert-watcher
          exit 1

  gitops:
    name: Deploy with ArgoCD on kind
    # ArgoCD pulls the chart from GitHub, so this only runs for commits already pushed to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
      - name: Build and load image into kind
        run: |
          docker build -t cert-watcher:e2e .
          kind load docker-image cert-watcher:e2e --name chart-testing
      - name: Install ArgoCD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm install argocd argo/argo-cd --version 7.7.0 \
            --namespace argocd --create-namespace --wait --timeout 5m
      - name: Point an ArgoCD Application at this commit
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: cert-watcher
            namespace: argocd
          spec:
            project: default
            source:
              repoURL: https://github.com/${GITHUB_REPOSITORY}.git
              targetRevision: ${GITHUB_SHA}
              path: helm/cert-watcher
              helm:
                valuesObject:
                  image:
                    repository: cert-watcher
                    tag: e2e
                    pullPolicy: Never
            destination:
              server: https://kubernetes.default.svc
              namespace: cert-watcher
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
          EOF
      - name: Wait for the Application to be Synced and Healthy
        run: |
          for attempt in $(seq 1 60); do
            sync=$(kubectl -n argocd get application cert-watcher -o jsonpath='{.status.sync.status}' || true)
            health=$(kubectl -n argocd get application cert-watcher -o jsonpath='{.status.health.status}' || true)
            echo "attempt $attempt: sync=$sync health=$health"
            if [ "$sync" = "Synced" ] && [ "$health" = "Healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          kubectl -n argocd get application cert-watcher -o yaml
          kubectl -n cert-watcher get pods
          exit 0
